name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Contenu en lecture partout ; le job release demande explicitement contents:write
# (créer la release) + id-token/attestations (provenance et signature).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mcp-control-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcp-control-cli-windows-x86_64
          # macOS : un seul livrable universel — les deux architectures sont
          # compilées puis fusionnées avec lipo en un binaire qui tourne natif
          # sur Intel ET Apple Silicon (macOS choisit la bonne au lancement).
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: mcp-control-cli-macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA — supply-chain)
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)
        with:
          key: ${{ matrix.target }}

      # `--locked` partout : le binaire publié est celui du Cargo.lock versionné,
      # pas d'une résolution refaite au moment du tag. `--features tls` active
      # l'écoute TLS 1.3 obligatoire hors loopback.
      - name: Tests
        run: cargo test --release --locked --features tls -p mcp-control

      - name: Clippy (strict, tous les targets)
        run: cargo clippy --release --locked -p mcp-control --all-targets --all-features -- -D warnings

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # cible universelle : compiler chaque architecture (lipo fusionne ensuite)
            for t in $(echo "${{ matrix.rust_targets }}" | tr ',' ' '); do
              cargo build --release --locked --features tls -p mcp-control --target "$t"
            done
          else
            cargo build --release --locked --features tls -p mcp-control --target ${{ matrix.target }}
          fi

      - name: Collecter le binaire
        shell: bash
        run: |
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          FILE="${{ matrix.artifact }}${EXT}"
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # fusion des deux architectures en un binaire universel
            lipo -create -output "$FILE" \
              target/aarch64-apple-darwin/release/mcp-control \
              target/x86_64-apple-darwin/release/mcp-control
            lipo -info "$FILE"
          else
            cp "target/${{ matrix.target }}/release/mcp-control${EXT}" "$FILE"
          fi
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (épinglé SHA)
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.FILE }}
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcp-control-desktop-windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mcp-control-desktop-linux-x86_64
          # macOS : un seul livrable universel (voir le job build)
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: mcp-control-desktop-macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)
        with:
          persist-credentials: false

      - name: Dépendances système (Linux — WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)
        with:
          key: desktop-${{ matrix.target }}

      - name: Build (Tauri / webview système)
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # cible universelle : compiler chaque architecture (lipo fusionne ensuite)
            for t in $(echo "${{ matrix.rust_targets }}" | tr ',' ' '); do
              cargo build --release --locked -p mcp-control-desktop --target "$t"
            done
          else
            cargo build --release --locked -p mcp-control-desktop --target ${{ matrix.target }}
          fi

      # Installateur Windows (wizard NSIS : langue, dossier, raccourcis).
      # `tauri build` réutilise le binaire déjà compilé et n'ajoute que le bundle.
      - name: CLI Tauri (Windows — installateur NSIS)
        if: runner.os == 'Windows'
        run: npm install --global @tauri-apps/cli@^2

      - name: Installateur NSIS (Windows — wizard)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        # `-- --locked` : mêmes dépendances que le binaire déjà compilé.
        run: npx tauri build --bundles nsis --target ${{ matrix.target }} -- --locked

      - name: Collecter le binaire
        shell: bash
        run: |
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          FILE="${{ matrix.artifact }}${EXT}"
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # fusion des deux architectures en un binaire universel
            lipo -create -output "$FILE" \
              target/aarch64-apple-darwin/release/mcp-control-desktop \
              target/x86_64-apple-darwin/release/mcp-control-desktop
            lipo -info "$FILE"
          else
            cp "target/${{ matrix.target }}/release/mcp-control-desktop${EXT}" "$FILE"
          fi
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          # installateur wizard NSIS (Windows uniquement)
          SETUP=$(ls "target/${{ matrix.target }}/release/bundle/nsis/"*-setup.exe 2>/dev/null | head -1 || true)
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "${{ matrix.artifact }}-setup.exe"
            echo "SETUP=${{ matrix.artifact }}-setup.exe" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (épinglé SHA)
        with:
          name: ${{ matrix.artifact }}
          # Windows : l'installateur wizard SEUL — le binaire portable desktop
          # n'est plus publié (NSIS l'embarque) ; les autres OS publient le
          # binaire desktop direct.
          path: ${{ runner.os == 'Windows' && env.SETUP || env.FILE }}
          if-no-files-found: error

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # créer la release GitHub
      id-token: write # cosign keyless + attestation de provenance (OIDC)
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (épinglé SHA)
        with:
          merge-multiple: true
          path: dist

      # SBOM CycloneDX (un par crate livré) — généré depuis les manifestes, donc
      # avec les licences, pas seulement des noms de paquets.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable

      - name: Installer cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10

      - name: Générer les SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5
          cp mcp-control.cdx.json dist/
          cp desktop/mcp-control-desktop.cdx.json dist/
          ls -l dist/*.cdx.json

      # Le glob s'étend AVANT la création du fichier : SHA256SUMS.txt ne se
      # liste jamais lui-même. Publié comme asset de la release (dist/*).
      - name: Sommes de contrôle SHA256 (SHA256SUMS.txt)
        run: |
          cd dist
          sha256sum * | sort -k2 > SHA256SUMS.txt
          wc -l SHA256SUMS.txt

      # Provenance : GitHub signe (Sigstore) une attestation liant chaque artefact
      # au commit + au workflow qui l'a construit. Vérification côté utilisateur :
      #   gh attestation verify <fichier> --repo DeamonDev888/mcp-control
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/mcp-control-*
            dist/SHA256SUMS.txt

      # Signature keyless (pas de clé privée à stocker) : le certificat éphémère
      # porte l'identité du workflow et le tag, et la signature entre dans le
      # journal de transparence Sigstore. Vérification :
      #   cosign verify-blob --certificate SHA256SUMS.txt.pem \
      #     --signature SHA256SUMS.txt.sig \
      #     --certificate-identity-regexp '^https://github.com/DeamonDev888/mcp-control/.github/workflows/release.yml@refs/tags/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     SHA256SUMS.txt
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Signer SHA256SUMS.txt
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.txt.sig \
            --output-certificate dist/SHA256SUMS.txt.pem \
            dist/SHA256SUMS.txt

      - name: Extraire les notes du CHANGELOG
        run: python3 scripts/extract_notes.py > notes.md

      - name: Organiser les téléchargements par OS
        run: |
          cat >> notes.md <<'MDEOF'

          ---

          ## 📦 Téléchargements par OS

          ### 🪟 Windows
          | Fichier | Quoi |
          |---|---|
          | `mcp-control-desktop-windows-x86_64-setup.exe` | **L'app avec fenêtre — installateur recommandé** (wizard : langue, dossier, raccourcis) |
          | `mcp-control-cli-windows-x86_64.exe` | CLI — moteur console (sans fenêtre — serveurs/scripts) |

          ### 🍎 macOS
          | Fichier | Quoi |
          |---|---|
          | `mcp-control-desktop-macos-universal` | **L'app avec fenêtre — binaire universel : Mac Intel ET Apple Silicon (M1→M4)** |
          | `mcp-control-cli-macos-universal` | CLI — moteur console — même binaire universel |

          ### 🐧 Linux (x86_64)
          | Fichier | Quoi |
          |---|---|
          | `mcp-control-desktop-linux-x86_64` | **L'app avec fenêtre** (webview WebKitGTK du système) |
          | `mcp-control-cli-linux-x86_64` | CLI — moteur console (idéal VPS/SSH) |

          Après téléchargement sur macOS/Linux : `chmod +x <fichier>` puis `./<fichier>`.
          Premier lancement macOS : clic droit sur le fichier → **Ouvrir** si Gatekeeper s'en mêle.

          ## 🔐 Vérifier un téléchargement

          `SHA256SUMS.txt` est signé (cosign keyless) et chaque binaire possède une
          attestation de provenance GitHub.

          ```sh
          # 1. signature des sommes (identité = ce workflow, ce tag)
          cosign verify-blob --certificate SHA256SUMS.txt.pem \
            --signature SHA256SUMS.txt.sig \
            --certificate-identity-regexp '^https://github.com/DeamonDev888/mcp-control/.github/workflows/release.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt

          # 2. provenance du binaire
          gh attestation verify mcp-control-desktop-windows-x86_64-setup.exe \
            --repo DeamonDev888/mcp-control

          # 3. somme du fichier
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          `*.cdx.json` : liste des composants (SBOM CycloneDX) de chaque crate livré.
          MDEOF

      - name: Créer la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (épinglé SHA)
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
