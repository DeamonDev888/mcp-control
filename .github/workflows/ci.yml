name: CI

# Chaque push / PR : fmt, tests unitaires (défaut et `--features tls`), E2E,
# clippy strict (`--all-features`), build release CLI (`--features tls`),
# compilation du crate desktop, compilation sans feature par défaut, et le
# contrôle des dépendances (cargo-deny + cargo-audit). Le lundi, seuls les
# contrôles de dépendances tournent : ils relisent l'état des avis RustSec même
# sans commit (dépendances amont, bases d'avis).

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # lundi 05:17 UTC — audit + deny hebdomadaires
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: false
          # macOS : ajouté pour couvrir les trois OS livrés. Rien ne permet de le
          # vérifier depuis la machine de développement (Windows) : le job est
          # donc tolérant à l'échec jusqu'à ce qu'un passage vert soit constaté.
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)

      - name: Format
        run: cargo fmt --check

      # `cargo test` nu ré-exécutait la suite unitaire ET l'E2E sous un seul
      # code de sortie : impossible de distinguer une régression unitaire d'un
      # scénario E2E instable. Deux commandes, deux verdicts.
      - name: Tests unitaires
        run: cargo test --lib --locked

      - name: Tests unitaires (TLS 1.3)
        run: cargo test --lib --locked --features tls

      - name: Tests E2E
        run: cargo test --test e2e --locked --features tls --no-fail-fast

      - name: Clippy (strict, tous les targets et features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Le binaire CLI en release n'est compilé par aucun autre check du job :
      # une régression de visibilité (E0603, audit 01 constats 1 et 5) ne serait
      # vue que par cargo test.
      - name: Build release (binaire CLI + TLS 1.3)
        run: cargo build --release --locked --features tls -p mcp-control

  desktop:
    name: desktop check ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)
        with:
          persist-credentials: false

      # Même liste que release.yml : sans WebKitGTK, `tauri` ne compile pas.
      - name: Dépendances système (Linux — WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)
        with:
          key: desktop-check-${{ matrix.os }}

      # Le crate desktop n'était compilé qu'au tag : une erreur de type dans
      # desktop/ n'était vue qu'au moment de publier. `cargo check` suffit ici.
      - name: cargo check (crate desktop)
        run: cargo check --locked -p mcp-control-desktop

  sans-feature:
    name: sans feature par défaut
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)
        with:
          key: sans-feature

      # Repli trousseau (clé sur fichier 0600) : ce chemin n'était jamais
      # compilé en CI alors qu'il est livrable.
      - name: Tests sans feature
        run: cargo test --lib --locked --no-default-features

      - name: Build release sans feature
        run: cargo build --release --locked -p mcp-control --no-default-features

  supply-chain:
    name: dépendances (deny + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)
        with:
          persist-credentials: false

      # Binaires précompilés : pas de cargo install de 5 minutes à chaque push.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6 (épinglé SHA)
        with:
          tool: cargo-deny,cargo-audit

      # deny.toml : avis, licences autorisées, sources crates.io seulement,
      # doublons signalés. Les exceptions sont justifiées une par une dedans.
      - name: cargo deny
        run: cargo deny check

      # cargo audit regarde TOUT le Cargo.lock (y compris les paquets hors
      # graphe de features) : complète deny, ne le remplace pas.
      - name: cargo audit
        run: cargo audit
