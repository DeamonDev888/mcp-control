<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- ========================================================== -->
    <!-- CHASSIS & DEEP SPACE ENVIRONMENT                           -->
    <!-- ========================================================== -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191d"/>
      <stop offset="48%" stop-color="#0b0b0e"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>

    <!-- Subtle Overhead Brushed Carbon Sheen -->
    <radialGradient id="topSheen" cx="50%" cy="6%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Bevel Catchlight -->
    <linearGradient id="rimBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>

    <!-- ========================================================== -->
    <!-- GRAVITATIONAL LENSING & SILKY ECLIPSE CORONA               -->
    <!-- ========================================================== -->
    <!-- Wide Atmospheric Scatter -->
    <radialGradient id="coronaWide" cx="42%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="28%" stop-color="#d4d4d8" stop-opacity="0.16"/>
      <stop offset="58%" stop-color="#71717a" stop-opacity="0.06"/>
      <stop offset="85%" stop-color="#27272a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tight High-Intensity Crescent Scatter -->
    <radialGradient id="coronaTight" cx="37%" cy="35%" r="32%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="42%" stop-color="#e4e4e7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Eclipse Corona Halo Gradient -->
    <linearGradient id="eclipseCoronaGrad" x1="12%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#f4f4f5"/>
      <stop offset="56%" stop-color="#a1a1aa" stop-opacity="0.72"/>
      <stop offset="82%" stop-color="#3f3f46" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Razor-Sharp Inner Photon Ring (Hugging the Event Horizon) -->
    <linearGradient id="photonRingGrad" x1="10%" y1="10%" x2="84%" y2="84%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="62%" stop-color="#d4d4d8" stop-opacity="0.45"/>
      <stop offset="88%" stop-color="#52525b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Pure Empty Event Horizon (Abyssal Black Hole Void) -->
    <radialGradient id="eventHorizon" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="38%" stop-color="#020203"/>
      <stop offset="75%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Diamond-Ring Optical Flare -->
    <radialGradient id="flareCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="54%" stop-color="#e4e4e7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flareRayH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flareRayV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ========================================================== -->
    <!-- SEAMLESS 360° PRECISION ORBITAL RING SYSTEM                -->
    <!-- ========================================================== -->
    <!-- Full continuous base ring (whisper-fine 360° trajectory) -->
    <linearGradient id="ringFullBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.14"/>
      <stop offset="30%" stop-color="#d4d4d8" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#e4e4e7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Front luminous sweep (sleek, delicate platinum filament, ZERO SEAM) -->
    <linearGradient id="ringFrontSweep" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d4d4d8" stop-opacity="0"/>
      <stop offset="16%" stop-color="#d4d4d8" stop-opacity="0.42"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="72%" stop-color="#e4e4e7" stop-opacity="0.65"/>
      <stop offset="88%" stop-color="#a1a1aa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringFrontSpec" x1="12%" y1="50%" x2="88%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ========================================================== -->
    <!-- LIQUID CHROME & PLATINUM SATELLITES                        -->
    <!-- ========================================================== -->
    <radialGradient id="satChromeLead" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#f4f4f5"/>
      <stop offset="62%" stop-color="#a1a1aa"/>
      <stop offset="88%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </radialGradient>

    <radialGradient id="satChromeMid" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#d4d4d8"/>
      <stop offset="68%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </radialGradient>

    <radialGradient id="satChromeFar" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#52525b"/>
    </radialGradient>

    <!-- ========================================================== -->
    <!-- SILKY OPTICAL FILTERS (NO HARD BANDING)                    -->
    <!-- ========================================================== -->
    <!-- Pure soft atmospheric corona blur (NO hard SourceGraphic overlay) -->
    <filter id="pureSoftBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="midSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="tightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ringSoftBloom" x="-20%" y="-45%" width="140%" height="190%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="satBloom" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ffffff" flood-opacity="0.46"/>
    </filter>

    <!-- Clip Everything Cleanly Inside Squircle -->
    <clipPath id="squircleClip">
      <rect x="48" y="48" width="928" height="928" rx="216"/>
    </clipPath>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. MACHINED CARBON CHASSIS                                   -->
  <!-- ============================================================ -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#chassisGrad)"/>

  <g clip-path="url(#squircleClip)">
    <!-- Overhead Soft Studio Light -->
    <rect x="48" y="48" width="928" height="928" fill="url(#topSheen)"/>

    <!-- Deep Atmospheric Eclipse Scatter -->
    <rect x="48" y="48" width="928" height="928" fill="url(#coronaWide)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#coronaTight)"/>

    <!-- Ultra-Subtle Micro-Starfield (Photographic Deep Space Depth) -->
    <g fill="#ffffff">
      <circle cx="176" cy="194" r="2.2" opacity="0.38"/>
      <circle cx="242" cy="148" r="1.4" opacity="0.22"/>
      <circle cx="788" cy="178" r="2.0" opacity="0.34"/>
      <circle cx="842" cy="244" r="1.3" opacity="0.20"/>
      <circle cx="152" cy="780" r="1.8" opacity="0.28"/>
      <circle cx="834" cy="792" r="2.1" opacity="0.32"/>
      <circle cx="748" cy="846" r="1.3" opacity="0.18"/>
      <circle cx="298" cy="842" r="1.5" opacity="0.22"/>
      <circle cx="876" cy="542" r="1.4" opacity="0.18"/>
      <circle cx="144" cy="442" r="1.5" opacity="0.20"/>
    </g>

    <!-- Subtle Gravitational Field Reference Ring -->
    <circle cx="512" cy="512" r="312" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5" stroke-dasharray="3 11"/>

    <!-- ========================================================== -->
    <!-- 2. CONTINUOUS 360° BASE ORBITAL SYSTEM (Whisper-Fine)      -->
    <!-- ========================================================== -->
    <g transform="rotate(-24 512 512)">
      <!-- Subtle Outer Whisper Track -->
      <ellipse cx="512" cy="512" rx="398" ry="128" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.2"/>
      <!-- Primary Continuous Ring (Sleek 360° hairline) -->
      <ellipse cx="512" cy="512" rx="364" ry="116" fill="none" stroke="url(#ringFullBase)" stroke-width="3.6"/>
    </g>

    <!-- ========================================================== -->
    <!-- 3. SILKY GARGANTUA CORONA, PHOTON RING & PURE BLACK HOLE   -->
    <!-- ========================================================== -->
    <!-- Layer A: Wide Velvety Atmospheric Corona (Pure Soft Blur) -->
    <circle cx="502" cy="502" r="196" fill="none" stroke="url(#eclipseCoronaGrad)" stroke-width="34" filter="url(#pureSoftBlur)" opacity="0.92"/>

    <!-- Layer B: Mid-Tight Luminous Crescent Glow (Pure Soft Blur) -->
    <circle cx="507" cy="507" r="192" fill="none" stroke="url(#eclipseCoronaGrad)" stroke-width="18" filter="url(#midSoftBlur)" opacity="0.95"/>

    <!-- Pure Empty Black Hole Sphere (ZERO elements inside!) -->
    <circle cx="516" cy="516" r="188" fill="url(#eventHorizon)"/>

    <!-- Layer C: Razor-Sharp Photon Ring Crescent Hugging the Event Horizon -->
    <path d="M 340 578 A 188 188 0 0 1 604 349"
          fill="none"
          stroke="url(#photonRingGrad)"
          stroke-width="6.5"
          stroke-linecap="round"
          filter="url(#tightGlow)"/>

    <!-- Delicate Diamond-Ring Optical Flare on Upper-Left Horizon Crest -->
    <g transform="translate(383, 383)">
      <circle cx="0" cy="0" r="62" fill="url(#flareCore)" opacity="0.72"/>
      <rect x="-104" y="-1.6" width="208" height="3.2" rx="1.6" fill="url(#flareRayH)" opacity="0.82"/>
      <rect x="-1.4" y="-62" width="2.8" height="124" rx="1.4" fill="url(#flareRayV)" opacity="0.62"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    </g>

    <!-- ========================================================== -->
    <!-- 4. SEAMLESS FOREGROUND ORBITAL FILAMENT (Sleek & Subtle)   -->
    <!-- ========================================================== -->
    <g transform="rotate(-24 512 512)">
      <!-- Delicate Soft Glow Along Foreground Trajectory -->
      <path d="M 148 512 A 364 116 0 0 0 876 512"
            fill="none"
            stroke="url(#ringFrontSweep)"
            stroke-width="10"
            filter="url(#ringSoftBloom)"
            opacity="0.28"/>

      <!-- Sleek Sculpted Platinum Foreground Line -->
      <path d="M 148 512 A 364 116 0 0 0 876 512"
            fill="none"
            stroke="url(#ringFrontSweep)"
            stroke-width="5.2"
            stroke-linecap="round"/>

      <!-- Ultra-Fine Specular Highlight Thread -->
      <path d="M 148 512 A 364 116 0 0 0 876 512"
            fill="none"
            stroke="url(#ringFrontSpec)"
            stroke-width="1.5"
            stroke-linecap="round"/>
    </g>

    <!-- ========================================================== -->
    <!-- 5. PRECISION-ALIGNED LIQUID CHROME SATELLITES              -->
    <!-- ========================================================== -->
    <!-- Lead Foreground Chrome Satellite (t = 55° on primary ellipse) -->
    <g transform="translate(741, 514)" filter="url(#satBloom)">
      <circle cx="0" cy="0" r="32" fill="#070709" stroke="#e4e4e7" stroke-opacity="0.88" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="41" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="21" fill="url(#satChromeLead)"/>
      <ellipse cx="-6.5" cy="-6.5" rx="6" ry="4" transform="rotate(-35 -6.5 -6.5)" fill="#ffffff" opacity="0.92"/>
    </g>

    <!-- Left Horizon Silver Satellite (t = 162° on primary ellipse) -->
    <g transform="translate(210, 686)" filter="url(#satBloom)">
      <circle cx="0" cy="0" r="28" fill="#070709" stroke="#d4d4d8" stroke-opacity="0.82" stroke-width="4"/>
      <circle cx="0" cy="0" r="18" fill="url(#satChromeMid)"/>
      <ellipse cx="-5.5" cy="-5.5" rx="5" ry="3.2" transform="rotate(-35 -5.5 -5.5)" fill="#ffffff" opacity="0.88"/>
    </g>

    <!-- Distant Top-Right Platinum Satellite (t = -22° on back orbit) -->
    <g transform="translate(803, 335)">
      <circle cx="0" cy="0" r="18" fill="#08080a" stroke="#d4d4d8" stroke-opacity="0.78" stroke-width="3.2"/>
      <circle cx="0" cy="0" r="10.5" fill="url(#satChromeFar)"/>
      <circle cx="-3" cy="-3" r="2.6" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>

  <!-- Crisp Outer Squircle Rim Catchlight -->
  <rect x="50.5" y="50.5" width="923" height="923" rx="213.5" fill="none" stroke="url(#rimBevel)" stroke-width="4.5"/>
</svg>