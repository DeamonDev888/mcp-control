<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="55%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>

    <!-- Core Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Outer Squircle Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Icon Container (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow1)" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Subtle Circuit Lines -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <path d="M 80 160 L 160 160 L 200 200"/>
    <circle cx="80" cy="160" r="4" fill="#38bdf8"/>
    <path d="M 432 160 L 352 160 L 312 200"/>
    <circle cx="432" cy="160" r="4" fill="#38bdf8"/>
    <path d="M 256 448 L 256 380"/>
    <circle cx="256" cy="448" r="4" fill="#38bdf8"/>
  </g>

  <!-- Orbital Status Rings -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#glowRing)" stroke-width="3" stroke-dasharray="16 12 40 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Satellite Nodes (MCP Topology: Client, Host, Tools) -->
  <!-- Top Node -->
  <g transform="translate(256, 92)" filter="url(#glow1)">
    <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
  </g>
  <!-- Line from Top to Center -->
  <line x1="256" y1="110" x2="256" y2="180" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Bottom-Left Node -->
  <g transform="translate(114, 338)" filter="url(#glow1)">
    <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#818cf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#818cf8"/>
  </g>
  <!-- Line from Bottom-Left to Center -->
  <line x1="128" y1="324" x2="194" y2="284" stroke="url(#purpleGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Bottom-Right Node -->
  <g transform="translate(398, 338)" filter="url(#glow1)">
    <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#06b6d4"/>
  </g>
  <!-- Line from Bottom-Right to Center -->
  <line x1="384" y1="324" x2="318" y2="284" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Center Core: Hexagonal Command Reactor -->
  <g filter="url(#softShadow)">
    <!-- Outer Hex Shield -->
    <polygon points="256,176 324,216 324,296 256,336 188,296 188,216" 
             fill="#0c1730" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Inner Stylized "M" Architecture -->
    <path d="M 214 286 L 214 232 L 256 264 L 298 232 L 298 286" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)"/>
    
    <!-- Core Pulse Center (Command Point) -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#glow1)"/>
  </g>

  <!-- Ping / Status Indicator (Green operational beacon) -->
  <circle cx="340" cy="180" r="6" fill="#10b981" filter="url(#glow1)"/>
  <circle cx="340" cy="180" r="11" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
</svg>