<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Chassis -->
    <linearGradient id="bg43" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <radialGradient id="aura43" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="52%" stop-color="#1e3a8a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim43" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.28"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Translucent Isometric Glass Faces -->
    <linearGradient id="faceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.07"/>
    </linearGradient>

    <linearGradient id="faceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="faceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Optical Edge Gradient -->
    <linearGradient id="edgeHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Master Core Sphere -->
    <radialGradient id="core43" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#dbeafe"/>
      <stop offset="68%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>

    <!-- Pearl Vertex Node -->
    <radialGradient id="vNode" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <!-- Emerald Apex Node -->
    <radialGradient id="apexEm" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <filter id="coreGlow43" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#3b82f6" flood-opacity="0.65"/>
    </filter>

    <filter id="nodeDrop43" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="emGlow43" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#34d399" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg43)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#aura43)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rim43)" stroke-width="2.5"/>

  <!-- Translucent Isometric Glass Faces -->
  <!-- Top Face -->
  <polygon points="256,108 384,182 256,256 128,182" fill="url(#faceTop)"/>
  <!-- Left Face -->
  <polygon points="128,182 256,256 256,404 128,330" fill="url(#faceLeft)"/>
  <!-- Right Face -->
  <polygon points="384,182 256,256 256,404 384,330" fill="url(#faceRight)"/>

  <!-- Back Internal Lattice Axes (Behind core, giving deep 3D tesseract feel) -->
  <g stroke="#60a5fa" stroke-opacity="0.24" stroke-width="2.5" stroke-dasharray="4 6">
    <line x1="256" y1="108" x2="256" y2="256"/>
    <line x1="128" y1="330" x2="256" y2="256"/>
    <line x1="384" y1="330" x2="256" y2="256"/>
  </g>

  <!-- Outer Precision Glass Wireframe Edges -->
  <polygon points="256,108 384,182 384,330 256,404 128,330 128,182"
           fill="none"
           stroke="url(#edgeHi)"
           stroke-width="3.5"
           stroke-linejoin="round"/>

  <!-- Front Y-Axis Optical Light Beams (Connecting Front Nodes to Center Core) -->
  <g stroke-linecap="round">
    <line x1="128" y1="182" x2="256" y2="256" stroke="#93c5fd" stroke-opacity="0.75" stroke-width="4.5"/>
    <line x1="384" y1="182" x2="256" y2="256" stroke="#93c5fd" stroke-opacity="0.75" stroke-width="4.5"/>
    <line x1="256" y1="404" x2="256" y2="256" stroke="#60a5fa" stroke-opacity="0.75" stroke-width="4.5"/>
  </g>

  <!-- Central Master Core (Suspended Inside the Cube) -->
  <g filter="url(#coreGlow43)">
    <circle cx="256" cy="256" r="46" fill="#091020" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="3"/>
    <circle cx="256" cy="256" r="35" fill="url(#core43)"/>
    <path d="M 234 240 A 28 28 0 0 1 274 233" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 6 Outer Vertex Nodes -->
  <!-- Top Apex (Emerald LIVE Status Node) -->
  <g transform="translate(256, 108)" filter="url(#emGlow43)">
    <circle cx="0" cy="0" r="19" fill="#061614" stroke="#34d399" stroke-width="3"/>
    <circle cx="0" cy="0" r="11" fill="url(#apexEm)"/>
  </g>

  <!-- Front-Left & Front-Right & Bottom Primary Nodes -->
  <g filter="url(#nodeDrop43)">
    <g transform="translate(128, 182)">
      <circle cx="0" cy="0" r="17" fill="#0b1120" stroke="#93c5fd" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="url(#vNode)"/>
    </g>
    <g transform="translate(384, 182)">
      <circle cx="0" cy="0" r="17" fill="#0b1120" stroke="#93c5fd" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="url(#vNode)"/>
    </g>
    <g transform="translate(256, 404)">
      <circle cx="0" cy="0" r="17" fill="#0b1120" stroke="#60a5fa" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="url(#vNode)"/>
    </g>
  </g>

  <!-- Back-Left & Back-Right Recessed Nodes -->
  <g transform="translate(128, 330)">
    <circle cx="0" cy="0" r="12" fill="#0b1120" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5.5" fill="#93c5fd"/>
  </g>
  <g transform="translate(384, 330)">
    <circle cx="0" cy="0" r="12" fill="#0b1120" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5.5" fill="#93c5fd"/>
  </g>
</svg>