<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Background App Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad1)" stroke="#27272a" stroke-width="2"/>

  <!-- Geometric Minimal Ribbon Monogram (M + C flow) -->
  <g transform="translate(0, 0)">
    <!-- Left Stalk of M -->
    <path d="M 136 348 L 136 196 C 136 170 156 148 182 148 C 206 148 226 168 228 192 L 232 284 C 234 308 252 328 276 328 C 300 328 320 308 320 284 L 320 164" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Stalk looping into C -->
    <path d="M 320 164 C 320 155 328 148 338 148 C 362 148 376 166 376 190 L 376 270 C 376 320 336 360 286 360 C 258 360 234 346 220 326" 
          fill="none" 
          stroke="#a855f7" 
          stroke-width="36" 
          stroke-linecap="round" 
          opacity="0.95"/>

    <!-- Subtle Center Control Dot -->
    <circle cx="276" cy="236" r="14" fill="#ffffff"/>
  </g>
</svg>