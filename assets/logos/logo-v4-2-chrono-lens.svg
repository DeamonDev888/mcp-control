<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Chassis Background -->
    <linearGradient id="bg42" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191c26"/>
      <stop offset="50%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>

    <linearGradient id="rim42" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Machined Metal Outer Bezel -->
    <linearGradient id="bezelMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </linearGradient>

    <!-- Recessed Optical Well -->
    <radialGradient id="well42" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#111d38"/>
      <stop offset="68%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040509"/>
    </radialGradient>

    <!-- Active Telemetry Arc (Sapphire to Emerald) -->
    <linearGradient id="activeArc42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Crystalline Optical Lens Core -->
    <radialGradient id="lensCore42" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#bae6fd"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="88%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>

    <!-- Inner Glass Reflection -->
    <linearGradient id="glassGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="bezelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="arcGlow42" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg42)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rim42)" stroke-width="2.5"/>

  <!-- Outer Machined Dial Chassis -->
  <g filter="url(#bezelShadow)">
    <circle cx="256" cy="256" r="176" fill="url(#bezelMetal)" stroke="#475569" stroke-opacity="0.45" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="154" fill="url(#well42)" stroke="#020617" stroke-width="4"/>
  </g>

  <!-- Precision Horology / Port-Scan Graduation Ticks (12 cardinal & radial marks) -->
  <g stroke="#94a3b8" stroke-linecap="round" opacity="0.45">
    <!-- 4 Major Cardinal Ticks -->
    <line x1="256" y1="88" x2="256" y2="102" stroke="#e2e8f0" stroke-width="3.5" opacity="0.9"/>
    <line x1="256" y1="410" x2="256" y2="424" stroke="#e2e8f0" stroke-width="3.5" opacity="0.9"/>
    <line x1="88" y1="256" x2="102" y2="256" stroke="#e2e8f0" stroke-width="3.5" opacity="0.9"/>
    <line x1="410" y1="256" x2="424" y2="256" stroke="#e2e8f0" stroke-width="3.5" opacity="0.9"/>

    <!-- 8 Intermediate Ticks (30° intervals) -->
    <line x1="340" y1="110.5" x2="334" y2="120.9" stroke-width="2.5"/>
    <line x1="401.5" y1="172" x2="391.1" y2="178" stroke-width="2.5"/>
    <line x1="401.5" y1="340" x2="391.1" y2="334" stroke-width="2.5"/>
    <line x1="340" y1="401.5" x2="334" y2="391.1" stroke-width="2.5"/>
    <line x1="172" y1="401.5" x2="178" y2="391.1" stroke-width="2.5"/>
    <line x1="110.5" y1="340" x2="120.9" y2="334" stroke-width="2.5"/>
    <line x1="110.5" y1="172" x2="120.9" y2="178" stroke-width="2.5"/>
    <line x1="172" y1="110.5" x2="178" y2="120.9" stroke-width="2.5"/>
  </g>

  <!-- Inner Track Groove -->
  <circle cx="256" cy="256" r="126" fill="none" stroke="#1e293b" stroke-width="10"/>

  <!-- Active Luminous Gauge Arc (approx 70% UP telemetry arc) -->
  <path d="M 152 328 A 126 126 0 1 1 378 288"
        fill="none"
        stroke="url(#activeArc42)"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#arcGlow42)"/>

  <!-- Fine Optical Reticle Filaments -->
  <g stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="256" y1="142" x2="256" y2="184"/>
    <line x1="256" y1="328" x2="256" y2="370"/>
    <line x1="142" y1="256" x2="184" y2="256"/>
    <line x1="328" y1="256" x2="370" y2="256"/>
  </g>

  <!-- Central Optical Lens Housing -->
  <circle cx="256" cy="256" r="82" fill="#070a12" stroke="#334155" stroke-width="3"/>
  <circle cx="256" cy="256" r="70" fill="url(#lensCore42)" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Realistic Glass Lens Specular Reflections -->
  <path d="M 206 232 A 56 56 0 0 1 286 208 A 48 48 0 0 0 218 244 Z" fill="url(#glassGlint)"/>
  <circle cx="232" cy="228" r="10" fill="#ffffff" opacity="0.55"/>
  <circle cx="284" cy="284" r="6" fill="#34d399" opacity="0.75"/>

  <!-- Crisp Center Aperture Ring -->
  <circle cx="256" cy="256" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Live Emerald Status Indicator Bead at End of Active Arc -->
  <g transform="translate(378, 288)">
    <circle cx="0" cy="0" r="12" fill="#052e16" stroke="#34d399" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
  </g>
</svg>