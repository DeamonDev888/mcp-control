<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Rich Slate-Black Chassis -->
    <linearGradient id="chassis4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171923"/>
      <stop offset="50%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>

    <radialGradient id="ambient4" cx="55%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Brushed Platinum C-Ring -->
    <linearGradient id="platinumArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Sapphire-Indigo Bridge Chevron -->
    <linearGradient id="sapphireBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Emerald Pulse Core -->
    <radialGradient id="pulseDot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <filter id="markShadow4" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="emeraldBloom4" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#34d399" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#chassis4)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#ambient4)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rim4)" stroke-width="2.5"/>

  <!-- Precision Brand Emblem -->
  <g filter="url(#markShadow4)">
    <!-- Outer Sculpted Platinum "C" Ring (270-degree precision arc with beveled terminals) -->
    <!-- Outer radius 148, inner radius 102, opening centered on right (0 deg) from -42 deg to +42 deg -->
    <path d="M 366 157
             A 148 148 0 1 0 366 355
             L 332 324
             A 102 102 0 1 1 332 188
             Z"
          fill="url(#platinumArc)"/>

    <!-- Inner Precision Specular Rim on Top Arc -->
    <path d="M 142 180 A 136 136 0 0 1 348 164" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Interlocking Sapphire Command / Protocol Chevron (Bridge entering the C) -->
    <path d="M 228 190
             L 286 190
             L 354 256
             L 286 322
             L 228 322
             L 296 256
             Z"
          fill="url(#sapphireBlade)"/>

    <!-- Specular Top Edge on Sapphire Chevron -->
    <path d="M 232 192 L 285 192 L 351 256" fill="none" stroke="#bfdbfe" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Live Emerald Control Node -->
  <g filter="url(#emeraldBloom4)">
    <circle cx="218" cy="256" r="24" fill="url(#pulseDot)"/>
    <circle cx="212" cy="249" r="6" fill="#ffffff" opacity="0.65"/>
  </g>
</svg>