<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background with Violet Tint -->
    <radialGradient id="bgGlow3" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1f1035"/>
      <stop offset="50%" stop-color="#120822"/>
      <stop offset="100%" stop-color="#07030e"/>
    </radialGradient>

    <!-- Facet Gradients for Isometric 3D "M / C" Prism -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="amberFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rim3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#170638"/>
    </linearGradient>

    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ec4899" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow3)" stroke="url(#rim3)" stroke-width="4"/>

  <!-- Geometric Accent Grid / Isometric Background Field -->
  <g opacity="0.12" stroke="#a855f7" stroke-width="1.5">
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="80" y1="160" x2="432" y2="360"/>
    <line x1="80" y1="360" x2="432" y2="160"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- The 3D Isometric "M-C" Nexus Prism Architecture -->
  <g filter="url(#prismGlow)" transform="translate(0, 8)">
    
    <!-- LEFT PILLAR of "M" (Isometric Column) -->
    <!-- Top Face -->
    <polygon points="120,200 176,168 216,190 160,222" fill="#c084fc"/>
    <!-- Left Face -->
    <polygon points="120,200 160,222 160,342 120,320" fill="url(#leftFacet)"/>
    <!-- Right/Inner Face -->
    <polygon points="160,222 216,190 216,310 160,342" fill="url(#rightFacet)"/>

    <!-- RIGHT PILLAR of "M" (Isometric Column) -->
    <!-- Top Face -->
    <polygon points="296,190 336,168 392,200 352,222" fill="#f472b6"/>
    <!-- Left/Inner Face -->
    <polygon points="296,190 352,222 352,342 296,310" fill="url(#leftFacet)"/>
    <!-- Right Face -->
    <polygon points="352,222 392,200 392,320 352,342" fill="url(#topFacet)"/>

    <!-- CENTRAL CHEVRON / ARCH of "M" (Floating Interlock) -->
    <!-- Top Face of Center Peak -->
    <polygon points="216,190 256,166 296,190 256,214" fill="#fb7185"/>
    <!-- Left Drop of V -->
    <polygon points="216,190 256,214 256,274 216,250" fill="url(#amberFacet)"/>
    <!-- Right Drop of V -->
    <polygon points="296,190 256,214 256,274 296,250" fill="url(#topFacet)"/>

    <!-- THE "CONTROL" C-RING / ENCLOSING DATA HOOD (Floating Above) -->
    <polygon points="256,104 360,164 330,182 256,140 182,182 152,164" fill="url(#topFacet)"/>

    <!-- Floating Energy Core / Quantum Hub at Center of V -->
    <g transform="translate(256, 290)" filter="url(#coreGlow)">
      <!-- Isometric Core Diamond -->
      <polygon points="0,-18 20,-6 0,6 -20,-6" fill="#ffffff"/>
      <polygon points="-20,-6 0,6 0,26 -20,14" fill="#38bdf8"/>
      <polygon points="0,6 20,-6 20,14 0,26" fill="#818cf8"/>
      <!-- Radiating Pulse Sparks -->
      <circle cx="0" cy="4" r="5" fill="#ffffff"/>
    </g>

    <!-- Bottom Bridge/Foundation: Base bar connecting tools -->
    <polygon points="160,342 256,396 352,342 322,326 256,364 190,326" fill="url(#leftFacet)" opacity="0.85"/>
  </g>

  <!-- Glowing Accent Dots (Port / Socket Nodes) -->
  <circle cx="140" cy="190" r="5" fill="#38bdf8" filter="url(#coreGlow)"/>
  <circle cx="372" cy="190" r="5" fill="#f43f5e" filter="url(#coreGlow)"/>
  <circle cx="256" cy="122" r="5" fill="#fbbf24" filter="url(#coreGlow)"/>
</svg>