<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Retro Midnight-Plum Space Chassis -->
    <linearGradient id="bg51" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1424"/>
      <stop offset="55%" stop-color="#110c17"/>
      <stop offset="100%" stop-color="#08050b"/>
    </linearGradient>

    <linearGradient id="rim51" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.30"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Warm Retro Solar Corona Bloom -->
    <radialGradient id="corona51" cx="42%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#ea580c" stop-opacity="0.30"/>
      <stop offset="68%" stop-color="#be123c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Retro Sunset Eclipse Rim -->
    <linearGradient id="eclipse51" x1="15%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="28%" stop-color="#fdba74"/>
      <stop offset="58%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#e11d48" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e1024" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pure Empty Black Hole Event Horizon -->
    <radialGradient id="hole51" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#130d18"/>
      <stop offset="45%" stop-color="#08050b"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>

    <!-- Retro Dual-Tone Orbital Ring -->
    <linearGradient id="sweepFront51" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#fed7aa" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#fb923c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="sweepBack51" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#fdba74" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Retro Satellites -->
    <radialGradient id="satCream51" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="58%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <radialGradient id="satCoral51" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="52%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>

    <filter id="glow51" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="satGlow51" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#f97316" flood-opacity="0.75"/>
    </filter>

    <clipPath id="back51"><rect x="0" y="0" width="512" height="256"/></clipPath>
    <clipPath id="front51"><rect x="0" y="256" width="512" height="256"/></clipPath>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg51)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#corona51)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rim51)" stroke-width="2.5"/>

  <!-- Subtle Retro Double Orbit (Back) -->
  <g transform="rotate(-24 256 256)" clip-path="url(#back51)">
    <ellipse cx="256" cy="256" rx="184" ry="59" fill="none" stroke="url(#sweepBack51)" stroke-width="5"/>
    <ellipse cx="256" cy="256" rx="166" ry="51" fill="none" stroke="#fdba74" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- Radiant Solar Eclipse Corona -->
  <circle cx="252" cy="252" r="96" fill="none" stroke="url(#eclipse51)" stroke-width="10.5" filter="url(#glow51)"/>

  <!-- Pure Empty Black Hole Sphere -->
  <circle cx="259" cy="259" r="93" fill="url(#hole51)"/>

  <!-- Retro Orbital Ring (Front) -->
  <g transform="rotate(-24 256 256)" clip-path="url(#front51)">
    <ellipse cx="256" cy="256" rx="184" ry="59" fill="none" stroke="url(#sweepFront51)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="256" cy="256" rx="184" ry="59" fill="none" stroke="#fff7ed" stroke-opacity="0.45" stroke-width="1.8"/>
    <ellipse cx="256" cy="256" rx="166" ry="51" fill="none" stroke="#fb923c" stroke-opacity="0.32" stroke-width="1.5"/>
  </g>

  <!-- Satellites -->
  <!-- Foreground Coral-Gold Satellite -->
  <g transform="translate(362, 266)" filter="url(#satGlow51)">
    <circle cx="0" cy="0" r="16" fill="#18080e" stroke="#fb7185" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9.5" fill="url(#satCoral51)"/>
    <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Left Horizon Warm Cream-Gold Satellite -->
  <g transform="translate(106, 312)" filter="url(#satGlow51)">
    <circle cx="0" cy="0" r="15" fill="#180e08" stroke="#fdba74" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8.5" fill="url(#satCream51)"/>
  </g>

  <!-- Distant Top-Right Satellite -->
  <g transform="translate(402, 186)">
    <circle cx="0" cy="0" r="9.5" fill="#180d14" stroke="#fb923c" stroke-opacity="0.85" stroke-width="2"/>
    <circle cx="0" cy="0" r="4.5" fill="#fff7ed"/>
  </g>
</svg>