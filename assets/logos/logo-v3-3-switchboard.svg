<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Obsidian Chassis -->
    <linearGradient id="chassis3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2028"/>
      <stop offset="50%" stop-color="#13151b"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>

    <linearGradient id="rim3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Top Switch Track (Emerald ON) -->
    <linearGradient id="trackOn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Bottom Switch Track (Recessed Dark) -->
    <linearGradient id="trackOff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#1a1e29"/>
    </linearGradient>

    <!-- Brushed Pearl-Titanium Knob (Top) -->
    <linearGradient id="knobLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Brushed Graphite-Steel Knob (Bottom) -->
    <linearGradient id="knobDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Subtle Ambient Emerald Glow -->
    <radialGradient id="greenAmb" cx="62%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Ambient Blue Glow -->
    <radialGradient id="blueAmb" cx="38%" cy="68%" r="38%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="knobShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="ledGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#chassis3)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#greenAmb)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#blueAmb)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rim3)" stroke-width="2.5"/>

  <!-- TOP SWITCH (ACTIVE / UP) -->
  <g transform="translate(0, -14)">
    <!-- Track Outer Bevel -->
    <rect x="116" y="138" width="280" height="112" rx="56" fill="url(#trackOn)"/>
    <rect x="117.5" y="139.5" width="277" height="109" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

    <!-- Subtle Power Line Mark ("I") inside left side of active track -->
    <line x1="176" y1="176" x2="176" y2="212" stroke="#ffffff" stroke-opacity="0.75" stroke-width="8" stroke-linecap="round"/>

    <!-- Machined Pearl Knob (Right / ON position) -->
    <g filter="url(#knobShadow)">
      <circle cx="340" cy="194" r="44" fill="url(#knobLight)"/>
      <!-- Subtle tactile inner dimple -->
      <circle cx="340" cy="194" r="30" fill="none" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="340" cy="194" r="7" fill="#10b981"/>
    </g>
  </g>

  <!-- BOTTOM SWITCH (BRIDGE / PROTOCOL) -->
  <g transform="translate(0, 14)">
    <!-- Recessed Dark Track -->
    <rect x="116" y="262" width="280" height="112" rx="56" fill="url(#trackOff)" stroke="#2a3040" stroke-width="2.5"/>

    <!-- Subtle Node Connection Marks on Right Side of Track -->
    <g opacity="0.85">
      <line x1="274" y1="318" x2="342" y2="318" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
      <circle cx="274" cy="318" r="6" fill="#60a5fa"/>
      <circle cx="308" cy="318" r="6" fill="#3b82f6"/>
      <circle cx="342" cy="318" r="7" fill="#60a5fa" filter="url(#ledGlow)"/>
    </g>

    <!-- Machined Dark Titanium Knob (Left position) -->
    <g filter="url(#knobShadow)">
      <circle cx="172" cy="318" r="44" fill="url(#knobDark)" stroke="#64748b" stroke-opacity="0.45" stroke-width="2"/>
      <!-- Specular top rim -->
      <path d="M 142 296 A 38 38 0 0 1 202 296" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
      <!-- Center Sapphire Indicator -->
      <circle cx="172" cy="318" r="9" fill="#3b82f6" filter="url(#ledGlow)"/>
      <circle cx="172" cy="318" r="4" fill="#dbeafe"/>
    </g>
  </g>
</svg>