<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#06241b"/>
      <stop offset="50%" stop-color="#061210"/>
      <stop offset="100%" stop-color="#020706"/>
    </radialGradient>

    <!-- Emerald / Cyber Neon Gradients -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="sliderKnob" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a32"/>
      <stop offset="100%" stop-color="#0a1914"/>
    </linearGradient>

    <linearGradient id="metallicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="switchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#00ff87" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow2)" stroke="url(#metallicBorder)" stroke-width="4"/>

  <!-- Background telemetry bars (Status metrics inspired by MCP Control) -->
  <g opacity="0.25" fill="#10b981">
    <rect x="80" y="380" width="8" height="32" rx="4"/>
    <rect x="96" y="360" width="8" height="52" rx="4"/>
    <rect x="112" y="390" width="8" height="22" rx="4"/>
    <rect x="128" y="350" width="8" height="62" rx="4"/>

    <rect x="376" y="370" width="8" height="42" rx="4"/>
    <rect x="392" y="350" width="8" height="62" rx="4"/>
    <rect x="408" y="385" width="8" height="27" rx="4"/>
    <rect x="424" y="365" width="8" height="47" rx="4"/>
  </g>

  <!-- Control Track (The Track where the toggle slides into ACTIVE) -->
  <rect x="166" y="106" width="180" height="300" rx="90" fill="#03100c" stroke="#134e4a" stroke-width="6"/>
  
  <!-- Active Slot Glow Track -->
  <line x1="256" y1="160" x2="256" y2="350" stroke="#00ff87" stroke-width="4" stroke-linecap="round" opacity="0.3" stroke-dasharray="10 8"/>

  <!-- Lower Terminal (Offline/Ground position socket) -->
  <circle cx="256" cy="340" r="16" fill="#082019" stroke="#134e4a" stroke-width="3"/>
  <circle cx="256" cy="340" r="5" fill="#0d9488" opacity="0.6"/>

  <!-- The Active Command Knob (Engaged / ON) -->
  <g transform="translate(0, -60)" filter="url(#switchShadow)">
    <!-- Knob Outer Body -->
    <circle cx="256" cy="240" r="82" fill="url(#sliderKnob)" stroke="url(#neonGreen)" stroke-width="5"/>
    <circle cx="256" cy="240" r="70" fill="#071914" stroke="#115e59" stroke-width="2"/>

    <!-- Dynamic "Power + M" Emblem carved into Knob -->
    <!-- Power Ring Segment -->
    <path d="M 226 215 A 34 34 0 1 0 286 215" fill="none" stroke="url(#neonGreen)" stroke-width="6.5" stroke-linecap="round" filter="url(#greenGlow)"/>
    
    <!-- Vertical Power Stdio Bar forming the center of M -->
    <line x1="256" y1="194" x2="256" y2="236" stroke="url(#neonGreen)" stroke-width="6.5" stroke-linecap="round" filter="url(#greenGlow)"/>

    <!-- Wing lines of "M" -->
    <path d="M 222 250 L 238 234 L 256 250 L 274 234 L 290 250" fill="none" stroke="#00ff87" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Operational Pulse Arc at Top (100% HEALTHY) -->
  <path d="M 196 90 A 70 70 0 0 1 316 90" fill="none" stroke="url(#neonGreen)" stroke-width="6" stroke-linecap="round" filter="url(#greenGlow)"/>
  
  <!-- "CONTROL" Status Pill at bottom -->
  <g transform="translate(256, 436)">
    <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#042017" stroke="#10b981" stroke-width="2"/>
    <circle cx="-42" cy="0" r="5" fill="#00ff87" filter="url(#greenGlow)"/>
    <text x="5" y="5" fill="#e6fffa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" letter-spacing="3" text-anchor="middle">ONLINE</text>
  </g>
</svg>